# Pi0.5 (jainbharat/pi05_5k, step 3000) served for the SO-101 with "top cam" + "wrist cam".
# Units match the ugv_jenga_box dataset: joints in degrees, gripper 0-100 range.
deployment: so101_jenga
model:
  repo_or_path: /tmp/pi05_3000
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 30.0
  action_deadline_s: 5.0
  idle_timeout_s: 30.0
  warmup_calls: 2
language:
  enabled: false
  deadline_s: 60.0
zenoh:
  mode: peer
  listen_endpoints: [tcp/127.0.0.1:7447]
semantics: so101-degrees-gripper-percent-v1
robot_type: so101_follower
features:
  - name: observation.state
    shape: [6]
    dtype: float32
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    semantics: so101-degrees-gripper-percent-v1
  - name: observation.images.top cam
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-side-table-v1
  - name: observation.images.wrist cam
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-wrist-v1
action_feature:
  name: action
  shape: [6]
  dtype: float32
  names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
  semantics: so101-degrees-gripper-percent-v1
